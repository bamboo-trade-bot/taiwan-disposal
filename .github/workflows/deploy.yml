name: 抓取並發佈處置股頁面

# 排程時間為 UTC；台北時間 = UTC + 8。
#
# 一律避開整點與半點：那是 GitHub 排程的尖峰，實測設 09:30 會被排到 14:24、
# 設 18:30 會被排到 22:31，延遲數小時。用奇數分鐘可明顯減少排隊。
#
# 08:17 台北（00:17 UTC）盤前：刷新基準價與名單
# 17:17 台北（09:17 UTC）收盤後：當日處置公告多半已發布
# 20:17 台北（12:17 UTC）晚間：補抓當日較晚發布的公告
#
# 頁面本身以瀏覽器當下的台北日期判定處置狀態，所以排程縱使延遲，
# 早上打開也不會停在昨天——只有「當日新增的公告」會晚一點進來。
on:
  schedule:
    - cron: "17 0 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "17 12 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      months:
        description: "統計區間月數"
        required: false
        default: "12"

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊工作直接取消
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取處置公告
        run: python fetch_disposal.py --months "${{ github.event.inputs.months || '12' }}"

      - name: 產生頁面
        # QUOTE_API 未設定時頁面就不顯示報價欄，行為與沒有這功能時相同。
        # 部署好 Worker 後，到 Settings → Secrets and variables → Actions → Variables
        # 新增 QUOTE_API，值為 Worker 網址。
        env:
          QUOTE_API: ${{ vars.QUOTE_API }}
        run: |
          python build_page.py
          mkdir -p _site
          cp disposal.html _site/index.html
          # 一併發佈原始資料，方便其他程式直接取用
          cp disposal_data.json _site/disposal_data.json

      - name: 檢查產出
        run: |
          test -s _site/index.html || { echo "index.html 是空的"; exit 1; }
          python - <<'PY'
          import json
          d = json.load(open("_site/disposal_data.json", encoding="utf-8"))
          n = len(d["rows"])
          print("rows:", n, "generated:", d["generated_at"])
          # 兩個來源都失效時 rows 會是 0，這種情況不要蓋掉線上還能用的舊版本
          assert n > 0, "沒有抓到任何公告，中止部署"
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
